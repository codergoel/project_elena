name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build:web

  api:
    name: API (ruff, mypy, pytest + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elena
          POSTGRES_PASSWORD: elena_dev
          POSTGRES_DB: elena
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U elena -d elena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
    env:
      DATABASE_URL: postgresql+asyncpg://elena:elena_dev@localhost:5432/elena
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"

      - name: Install TeX (LaTeX tier)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            poppler-utils texlive-fonts-extra texlive-latex-extra texlive-latex-recommended

      - name: Sync, migrate, lint, typecheck, pytest
        working-directory: services/api
        run: |
          uv sync --frozen --all-groups
          uv run alembic upgrade head
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy
          uv run pytest
          uv run pytest -o addopts= -q -m integration
          uv run pytest -o addopts= -q -m latex

  docker-api:
    name: Docker (API image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          file: services/api/Dockerfile
          push: false
          tags: elena-api:ci

  docker-latex:
    name: Docker (LaTeX image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build LaTeX image
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/latex
          file: infra/docker/latex/Dockerfile
          push: false
          tags: elena-latex:ci
