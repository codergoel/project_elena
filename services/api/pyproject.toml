[project]
name = "elena"
version = "0.1.0"
description = "Elena resume API (FastAPI + Deep Agents — layout for checkpoint 1.1)"
readme = "README.md"
authors = [
    { name = "Tanmay Goel", email = "official.tanmay1306@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.29.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "prometheus-client>=0.21.0",
    "pypdf>=5.0.0",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.9",
    "redis[hiredis]>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=1.2.1",
    "langchain-core>=1.4.0",
    "langchain-google-genai>=4.2.3",
    "langgraph-checkpoint-postgres>=3.1.0",
]

[dependency-groups]
dev = [
    "reportlab>=4.0.0",
    "fakeredis[lua]>=2.26.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
elena = "elena:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs live Postgres + Redis (skipped in default pytest addopts)",
    "latex: invokes pdflatex (skipped in default pytest addopts)",
]
addopts = "-m \"not integration and not latex\""

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["elena"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
